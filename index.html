<script type="text/javascript">

function logger_func(msg){
    let ul = document.getElementById("log");
    let li = document.createElement("li")
    // ul.appendChild(li.appendChild(document.createTextNode(msg)))
    let msg_node = document.createTextNode(msg);
    li.appendChild(msg_node)
    ul.appendChild(li)

}








function evaluate_func(){
    // alert('function called')
    let value = document.getElementById("expression").value
    // let output = eval(value)
    if(value===""){
        alert("please enter the input")
    }
    else{
        try {
            logger_func(`${value}`+"="+`${math.evaluate(value)}`)
            document.getElementById("expression").value = math.evaluate(value)
        } catch (error) {
            logger_func("Expression "+`${value}`+"is bad,please fix it")
            
        }
        
    }

}

function init_app(){

    let calculate_button = document.getElementById("calculate")
    calculate_button.addEventListener("click",evaluate_func)

}

init_app();



function input_numbers(v){
    let value = document.getElementById("expression").value;
    value = value+v;
    document.getElementById("expression").value=value;
}

function input_operator(o){
    let value = document.getElementById("expression").value;
    value = value+o;
    document.getElementById("expression").value=value;
}





</script>
